resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;
resolver_timeout 5s;

# GitHub-username regex (per docs): 1–39 chars, alphanumeric or hyphen, cannot start/end with hyphen, no consecutive hyphens.
# Implemented as a non-trivial PCRE so reserved paths like "settings", "marketplace", "orgs" still match by character class —
# we additionally enforce a denylist via map below so they cannot be used as a "username" via the proxy.
map $gh_user $gh_user_blocked {
    default                  0;
    ~*^(settings|marketplace|sponsors|notifications|orgs|apps|users|topics|trending|collections|features|pricing|enterprise|customer-stories|security|login|logout|join|new|search|stars|gist|gists|issues|pulls|explore|about|contact|site|codespaces|copilot|raw|blob|tree|commit|compare|wiki|releases|actions|projects|packages|discussions)$  1;
}

server {
    listen 3000 default_server;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Proxy to the macOS-host notify-helper so the dashboard can fire native
    # AppleScript notifications. Helper runs on the host at 127.0.0.1:3001;
    # Docker reaches it via host.docker.internal.
    location = /api/notify {
        proxy_pass http://host.docker.internal:3001/notify;
        proxy_set_header Host localhost;
        proxy_set_header Origin "http://localhost:3000";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header Cache-Control "no-store" always;
    }

    # Proxy GitHub profile HTML so the dashboard can scrape achievement badges
    # (GitHub blocks direct browser fetches via CORS for github.com/<user>)
    location ~ "^/gh-profile/(?<gh_user>[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38})$" {
        if ($gh_user_blocked) { return 403; }
        proxy_pass https://github.com/$gh_user;
        proxy_set_header Host github.com;
        proxy_set_header User-Agent "Mozilla/5.0 GH-Dashboard";
        proxy_set_header Accept "text/html";
        # Defence-in-depth: do not forward any client-sent auth/session headers
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_ssl_server_name on;
        proxy_ssl_name github.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "private, max-age=300" always;
    }

    # Proxy the full achievements tab
    location ~ "^/gh-achievements/(?<gh_user>[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38})$" {
        if ($gh_user_blocked) { return 403; }
        set $args "tab=achievements";
        proxy_pass https://github.com/$gh_user;
        proxy_set_header Host github.com;
        proxy_set_header User-Agent "Mozilla/5.0 GH-Dashboard";
        proxy_set_header Accept "text/html";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_ssl_server_name on;
        proxy_ssl_name github.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "private, max-age=300" always;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}
